<!DOCTYPE html>
<!-- ============================================================
     SEARCH INDEX BUILDER — a development tool, not part of the site.

     The site search reads a prebuilt index from data/search-index.js.
     This page holds the extractor that builds it, and the list of
     pages it covers.

     THE NORMAL WAY TO REBUILD
       node tools/build-search-index.js --write
     That script loads this page and uses its PAGES, extract() and
     checkAnchors(), so there is only one extractor.

     BY HAND, IN A BROWSER
       1. Start the local server:  node .claude/serve.js
       2. Open  http://localhost:8427/build-search-index.html
       3. Click Build, then Download.
       4. Save the downloaded file over site/data/search-index.js.
     It must be served over http://, not opened as a file:// path.
     Iframes from file:// can't be read for security reasons.

     THE EXTRACTOR READS THE REAL DOM. Do not replace it with regex
     parsing of the HTML: that swallows <thead> rows and runs a <p>
     past its closing tag into the following table.

     ONE RULE WORTH KEEPING
       Before trusting a modified extractor, re-run it on a page you did
       NOT change and confirm the output is byte-identical to what is
       already stored. That check is what catches silent content loss.
     ============================================================ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Search Index</title>
<link rel="stylesheet" href="assets/styles.css?v=20261023k">
<style>
  #actions{display:flex;gap:12px;margin:16px 0;}
  #log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;white-space:pre-wrap;
       background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
       padding:12px;max-height:50vh;overflow:auto;margin-top:16px;}
  #sandbox{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;}
</style>
</head>
<body>
<main id="content"><div class="page-inner">

  <header class="page-head">
    <p class="eyebrow">Development tool</p>
    <h1>Build Search Index</h1>
  </header>

  <p class="note">Indexes every page in the <code>PAGES</code> array in this file's script.</p>

  <div id="actions">
    <button type="button" class="btn btn-primary" id="go">Build</button>
    <button type="button" class="btn btn-ghost" id="dl" disabled>Download search-index.js</button>
  </div>

  <div id="log">Ready.</div>

</div></main>
<iframe id="sandbox"></iframe>

<script>
/* ---- EDIT ME: every content page to index, in nav order. ----
   One line per topic page, e.g.  "day1-first-topic.html",
   tools/verify.js fails if a page listed in assets/site.js is in
   neither this array nor NOT_INDEXED. */
const PAGES = [
  "signature-exemplar.html",
  "signature-hematologic.html",
  "signature-cardiovascular.html",
  "signature-renal.html",
  "signature-gi-hepatic.html",
  "signature-neuro.html",
  "signature-priority-problems.html",
  "day1-respiratory.html",
  "day1-oxygen-therapy.html",
  "day1-hematologic.html",
  "day1-acute-pancreatitis.html",
  "day2-cardiovascular.html",
  "day2-rhythms-pacemakers.html",
  "day2-acute-kidney-injury.html",
  "day2-nutrition.html",
  "day3-gastrointestinal.html",
  "day3-liver-failure.html",
  "day3-neuro-assessment-icp.html",
  "day3-brain-injury-stroke.html",
  "day3-spinal-cord-injury.html",
  "day4-hemodynamics.html",
  "day4-shock-sepsis-mods.html",
  "day5-iv-medications.html",
  "day5-end-of-life.html",
  "review-respiratory.html",
  "review-respiratory-diseases.html",
  "review-chest-tubes.html",
  "review-abgs.html",
  "review-hematology.html",
  "review-transfusions.html",
  "review-cardiovascular.html",
  "review-heart-disease.html",
  "review-dysrhythmias.html",
  "review-renal.html",
  "review-gi.html",
  "review-neuro.html",
  "review-pain.html",
];

/* Pages that are in the nav but deliberately NOT indexed: anything whose
   content is drawn by JavaScript at runtime, so there is no static text to
   extract. The home page and this tool are never indexed and need no entry. */
const NOT_INDEXED = [
  // signature-practice.html goes here when it comes back from archive/:
  // a practice tool whose deal and feedback are drawn by its script.
];

/* First line of the generated file. tools/build-search-index.js reads it
   from here, so the two builders write the same thing. */
const HEADER = "/* search-index.js — prebuilt full-text index (generated by tools/build-search-index.js). */\n";

/* Truncation limit for a single stored string. Keep this stable — the
   whole file gets compared against itself when validating a change. */
const MAX = 240;

const log = document.getElementById("log");
let output = null;

function say(msg){ log.textContent += "\n" + msg; }

function slugify(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function clean(el){
  const c = el.cloneNode(true);
  // .sec-caret and .page-top are injected by site.js at runtime (the collapse
  // caret on every h2.block, and the "On this page" block under the header).
  // They are page chrome, not content — strip them or they leak into the index
  // as "Heading▾" labels and a duplicated table of contents.
  c.querySelectorAll("img,button,script,style,.fig-store,.sec-caret,.page-top,.tab-bar").forEach(n => n.remove());
  return c.textContent.replace(/\s+/g," ").trim();
}
function cut(s){ return s.length > MAX ? s.slice(0, MAX) + "…" : s; }

/* Does every stored anchor actually point at something on the page?
   It has to resolve against the DOCUMENT. Checking only that the anchor is
   well formed validates the builder's output against itself and proves
   nothing. */
function checkAnchors(doc, entry){
  const problems = [];
  const seen = new Set();
  entry.secs.forEach(sec => {
    if(!sec.a) return;                       // the page-head section, blank by design
    if(!doc.getElementById(sec.a)) problems.push(entry.f + "#" + sec.a + " (resolves to nothing)");
    else if(seen.has(sec.a)) problems.push(entry.f + "#" + sec.a + " (duplicate anchor)");
    seen.add(sec.a);
  });
  return problems;
}

function extract(doc, file){
  const inner = doc.querySelector(".page-inner");
  if(!inner) return null;

  const title = (doc.querySelector(".page-head h1") || {}).textContent || file;
  const secs = [];
  // The page-head section: anchor "", holding the eyebrow text. Seeding the
  // walker with this (rather than starting at the first h2.block) is what
  // keeps any content sitting above the first heading from being dropped.
  let cur = { s: title.trim(), a: "", k: [] };
  const eyebrow = inner.querySelector(".page-head .eyebrow");
  if(eyebrow) cur.k.push(clean(eyebrow));
  secs.push(cur);

  const SELECT = "h2.block, h3.sub, h4, p, li, figcaption, .mnemonic, .callout-danger, tbody tr";
  let stopped = false;

  inner.querySelectorAll(SELECT).forEach(el => {
    if(stopped) return;
    if(el.closest("header.page-head")) return;      // already handled
    // .page-top = site.js TOC + tab chrome. .tab-empty is the placeholder
    // line in a tab panel with no content yet — chrome, not study material.
    if(el.closest(".flash-grid, .fig-store, .page-top, .tab-empty")) return;

    if(el.matches("h2.block")){
      const t = clean(el);
      // Everything from a flashcard heading onward is excluded.
      if(/flashcards?$/i.test(t)){ stopped = true; return; }
      // The REAL element id, not a slug of the heading text. On a tabbed page
      // site.js opens the tab that OWNS the anchor, so an anchor that resolves
      // nowhere leaves the reader on the default tab with the content they
      // searched for still hidden. slugify stays as a fallback for a heading
      // with no id; checkAnchors will flag it.
      cur = { s: t, a: el.id || slugify(t), k: [t] };
      secs.push(cur);
      return;
    }
    let text;
    if(el.matches("tbody tr")){
      text = Array.from(el.children).map(td => clean(td)).filter(Boolean).join(" — ");
    } else {
      text = clean(el);
    }
    if(text) cur.k.push(cut(text));
  });

  // Drop empty sections and de-duplicate keywords within a section.
  return {
    f: file,
    t: title.trim(),
    secs: secs.filter(s => s.k.length).map(s => ({ s: s.s, a: s.a, k: [...new Set(s.k)] }))
  };
}

function loadPage(file){
  return new Promise((resolve, reject) => {
    const fr = document.getElementById("sandbox");
    fr.onload = () => {
      try { resolve(fr.contentDocument); }
      catch(e){ reject(new Error("cannot read " + file + " — serve over http://, not file://")); }
    };
    fr.onerror = () => reject(new Error("failed to load " + file));
    fr.src = file + "?indexing=1";
  });
}

document.getElementById("go").addEventListener("click", async () => {
  log.textContent = "Building…";
  const out = [];
  const bad = [];
  for(const file of PAGES){
    try{
      const doc = await loadPage(file);
      // Let the page's own scripts finish adding ids/sections.
      await new Promise(r => setTimeout(r, 120));
      const entry = extract(doc, file);
      if(!entry){ say("  ! " + file + " has no .page-inner — skipped"); continue; }
      const keys = entry.secs.reduce((n, s) => n + s.k.length, 0);
      say("  " + file.padEnd(34) + entry.secs.length + " sections, " + keys + " keys");
      bad.push(...checkAnchors(doc, entry));   // while doc is still alive
      out.push(entry);
    }catch(e){ say("  ! " + e.message); }
  }
  say("\n" + out.length + " pages, " +
      out.reduce((n,p) => n + p.secs.length, 0) + " sections, " +
      (bad.length ? bad.length + " BAD ANCHORS: " + bad.join(", ") : "0 bad anchors"));
  output = HEADER + "window.SEARCH_INDEX = " + JSON.stringify(out) + ";\n";
  document.getElementById("dl").disabled = false;
  say("\nReady to download (" + output.length + " bytes).");
});

document.getElementById("dl").addEventListener("click", () => {
  if(!output) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([output], {type:"text/javascript"}));
  a.download = "search-index.js";
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
